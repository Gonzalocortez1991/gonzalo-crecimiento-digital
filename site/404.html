<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Gonzalo Crecimiento Digital</title>
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0D0D0D; --neon:#A6FF00; --gray:#888; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh; display:grid; place-items:center; padding:32px;
    background:
      radial-gradient(circle at 50% 0%, rgba(166,255,0,.08), transparent 55%),
      var(--bg);
    color:#fff; font-family:Inter, system-ui, sans-serif; text-align:center;
  }
  .card { max-width:560px; border:1px solid rgba(166,255,0,.18); background:rgba(10,10,10,.8); padding:56px 32px; }
  .label { font-family:"DM Mono", monospace; font-size:11px; letter-spacing:.35em; text-transform:uppercase; color:var(--neon); }
  h1 { font-size:clamp(56px, 16vw, 112px); line-height:.9; margin:20px 0 12px; letter-spacing:-.04em; }
  h1 span { color:var(--neon); }
  p { color:var(--gray); font-size:15px; line-height:1.7; }
  a {
    display:inline-block; margin-top:28px; padding:14px 28px; border:1px solid var(--neon);
    color:var(--neon); text-decoration:none; font-size:11px; font-weight:600;
    letter-spacing:.15em; text-transform:uppercase; transition:.2s ease;
  }
  a:hover { background:var(--neon); color:#000; box-shadow:0 0 24px rgba(166,255,0,.35); }
</style>
</head>
<body>
  <main class="card">
    <div class="label">// Error de navegación</div>
    <h1>4<span>0</span>4</h1>
    <p>La página que buscás no existe o cambió de lugar.<br>Volvé al inicio para seguir explorando el sistema.</p>
    <a href="/">Volver al inicio</a>
  </main>
</body>
</html>
